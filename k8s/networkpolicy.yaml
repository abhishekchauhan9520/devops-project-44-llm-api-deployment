apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-api
  namespace: llm-api
spec:
  podSelector:
    matchLabels:
      app: llm-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
